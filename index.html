<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>我的影子罷工了｜3D互動展館</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#d8d1c6;font-family:system-ui,"Noto Sans TC",sans-serif;color:#302a2a}button{font:inherit;cursor:pointer}#view{position:fixed;inset:0;perspective:850px;perspective-origin:50% 48%;overflow:hidden;touch-action:none;background:linear-gradient(#cac8c9 0%,#eae4d9 48%,#b8aa98 49%,#958b82 100%)}#room{position:absolute;left:50%;top:49%;height:1px;width:1px;transform-style:preserve-3d;will-change:transform}.wall{position:absolute;transform-style:preserve-3d;background:linear-gradient(180deg,#f6f3ee,#dbd7d1);box-shadow:inset 0 0 50px #9996;border:9px solid #ddd5ca;display:flex;align-items:center;justify-content:space-around;padding:45px 36px 30px;gap:32px}.front{width:1050px;height:460px;left:-525px;top:-235px;transform:translateZ(-700px)}.left{width:1160px;height:460px;left:-580px;top:-235px;transform:translateX(-580px) rotateY(90deg)}.right{width:1160px;height:460px;left:-580px;top:-235px;transform:translateX(580px) rotateY(-90deg)}.back{width:1050px;height:460px;left:-525px;top:-235px;transform:translateZ(580px) rotateY(180deg)}.floor{position:absolute;width:1160px;height:1280px;left:-580px;top:-640px;transform:translateY(230px) rotateX(90deg);background:repeating-linear-gradient(90deg,#bdb5a9 0,#bdb5a9 2px,#c8c1b7 2px,#c8c1b7 115px);border:4px solid #938a7c}.ceiling{position:absolute;width:1160px;height:1280px;left:-580px;top:-640px;transform:translateY(-230px) rotateX(90deg);background:#ebe6df}.piece{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:240px;height:320px;background:white;border:10px solid #27272a;box-shadow:0 8px 24px #0003;padding:8px;color:#252525;cursor:pointer;flex-shrink:0}.piece img{display:block;max-width:100%;max-height:255px;object-fit:contain}.piece .fallback{display:none;font-size:23px;font-weight:700;text-align:center;background:#f8e9de;height:250px;width:100%;align-items:center;justify-content:center}.piece img.bad{display:none}.piece img.bad+.fallback{display:flex}.piece span{font-size:15px;margin-top:7px}.intro{font-size:44px;font-weight:600;letter-spacing:.08em;text-align:center;white-space:nowrap}.hint{position:fixed;top:12px;left:12px;background:#202028db;color:#fff;border-radius:14px;padding:12px 15px;max-width:min(76vw,360px);box-shadow:0 5px 20px #0003;z-index:5}.hint strong{display:block;font-size:16px}.hint small{display:block;margin-top:4px;line-height:1.5;color:#eee}#controls{position:fixed;right:14px;bottom:16px;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:7px;z-index:5}.ctrl{border:1px solid #ffffff7a;border-radius:13px;background:#232530e8;color:white;font-size:23px;touch-action:none}#turn{position:fixed;left:12px;bottom:16px;display:flex;gap:8px;z-index:5}.turnbtn{padding:13px;background:#232530e8;border:1px solid #ffffff7a;color:white;border-radius:12px;font-size:16px;touch-action:none}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#090c12c2;z-index:9;padding:16px}.modal.open{display:flex}.dialog{width:min(90vw,580px);max-height:88vh;overflow:auto;background:#ffffffef;border-radius:18px;padding:20px;text-align:center;backdrop-filter:blur(12px)}.dialog h2{margin:3px 0 12px}.dialog img{max-height:53vh;max-width:100%;object-fit:contain}.dialog p{line-height:1.65}#close{background:#292b38;color:white;border:0;padding:10px 24px;border-radius:10px}.notice{position:fixed;left:50%;transform:translateX(-50%);bottom:114px;padding:8px 14px;border-radius:40px;background:#26272aaf;color:white;z-index:5;font-size:12px;pointer-events:none;white-space:nowrap}@media(max-width:600px){.hint{max-width:62vw;padding:9px 11px}.hint strong{font-size:13px}.hint small{font-size:11px}.notice{bottom:94px}}

/* Cinematic circular gallery */
html,body{background:#0a0b10;color:#f5f0e9}
#view{background:radial-gradient(ellipse at 50% 37%,#30313b 0%,#151820 47%,#090b11 80%);perspective:890px}
.wall{background:linear-gradient(90deg,#202530 0%,#303543 50%,#1b202c 100%);border:0;border-left:1px solid #7a798044;border-right:1px solid #090a0c;box-shadow:inset 0 20px 50px #0008;display:flex;align-items:center;justify-content:center;padding:22px}
.floor{border:0!important;background:radial-gradient(circle at center,#39363c 0%,#282830 35%,#10141b 75%)!important;box-shadow:inset 0 0 130px #000}
.ceiling{background:radial-gradient(circle,#34333b 0%,#161923 64%,#0b1018 100%)!important}
.piece{width:218px;height:315px;padding:10px 9px 9px;border:8px solid #15161c;background:#15151b;color:#e7d4b3;box-shadow:0 0 0 1px #a2a8b755,0 12px 32px #000b,0 -28px 43px -32px #fce4bb;transition:filter .2s ease}
.piece:active{filter:brightness(1.2)}
.piece img{max-height:258px;max-width:100%;border-radius:1px}
.piece span{font-size:13px;letter-spacing:.15em;margin-top:10px}
.piece .fallback{background:#34303b;color:#e6dacb}
.artlight{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:215px;height:6px;background:#f5d4a0;box-shadow:0 0 18px 8px #f5d4a077,0 18px 55px 17px #f5d4a02e}
.sectionmark{position:absolute;bottom:17px;text-align:center;color:#bcb5a8;font-size:10px;letter-spacing:.36em}
.galleryTitle{position:absolute;left:50%;top:-115px;transform:translateX(-50%);text-align:center;color:#e2d6c4;white-space:nowrap;letter-spacing:.22em;font-size:35px;text-shadow:0 4px 27px #000}
#room{top:52%}
.hint{background:#10131bdd;border:1px solid #c2ad8b55;box-shadow:0 12px 30px #0007}
.hint strong{color:#f3e4cb}
.ctrl,.turnbtn{background:#161a26eb;border-color:#d1ad7e66}
.ctrl:active,.turnbtn:active{background:#6d5a46}
.dialog{background:#202531ef;color:#f2eee9;border:1px solid #b9a37f55}
#close{background:#ceb58e;color:#171b22}
.notice{background:#181b23d9;color:#ded2be}
</style></head><body><div id="view"><div id="room"><div class="floor"></div><div class="ceiling"></div><div class="wall front"><div class="piece" data-i="0"><img src="assets/作品01.jpg" onerror="this.classList.add('bad')"><div class="fallback">電影海報</div><span>電影海報</span></div><div class="intro">我的影子<br>罷工了</div><div class="piece" data-i="1"><img src="assets/作品02.jpg" onerror="this.classList.add('bad')"><div class="fallback">角色設定</div><span>角色設定</span></div></div><div class="wall left"><div class="piece" data-i="2"><img src="assets/作品03.jpg" onerror="this.classList.add('bad')"><div class="fallback">服裝設計</div><span>服裝設計</span></div></div><div class="wall right"><div class="piece" data-i="3"><img src="assets/作品04.jpg" onerror="this.classList.add('bad')"><div class="fallback">角色立繪</div><span>角色立繪</span></div></div><div class="wall back"><div class="piece" data-i="4"><img src="assets/作品05.jpg" onerror="this.classList.add('bad')"><div class="fallback">動畫分鏡</div><span>動畫分鏡</span></div></div></div></div><div class="hint"><strong>我的影子罷工了｜3D 展館</strong><small>手指左右滑動可轉頭，右下角箭頭移動，點圖片看作品。</small></div><div id="turn"><button class="turnbtn" data-key="ql">↶ 左轉</button><button class="turnbtn" data-key="qr">右轉 ↷</button></div><div id="controls"><span></span><button class="ctrl" data-key="f">▲</button><span></span><button class="ctrl" data-key="l">◀</button><button class="ctrl" data-key="b">▼</button><button class="ctrl" data-key="r">▶</button></div><div class="notice">不需要 VR 眼鏡，iPad 也能操作</div><div id="modal" class="modal"><div class="dialog"><h2 id="mt"></h2><img id="mi"><p id="md"></p><button id="close">關閉</button></div></div><script>
(()=>{const names=['電影海報','角色設定','服裝設計','角色立繪','動畫分鏡'],texts=['《我的影子罷工了》動畫主視覺。','主角人物與表情設定。','角色服裝與造型設計。','角色全身立繪。','動畫故事分鏡。'];const room=document.getElementById('room'),view=document.getElementById('view');const oldWalls=[...room.querySelectorAll('.wall')];oldWalls.forEach(el=>el.remove());const N=16,R=680;for(let j=0;j<N;j++){const a=j*2*Math.PI/N,wall=document.createElement('div');wall.className='wall ringWall';wall.style.width='270px';wall.style.height='480px';wall.style.left='-135px';wall.style.top='-240px';wall.style.transform='translate3d('+Math.round(Math.sin(a)*R)+'px,0,'+Math.round(Math.cos(a)*R)+'px) rotateY('+(a*180/Math.PI+180)+'deg)';const idx=({8:0,11:1,14:2,2:3,5:4})[j];if(idx!==undefined){const p=document.createElement('div');p.className='piece';p.dataset.i=String(idx);const img=document.createElement('img');img.src='assets/作品0'+(idx+1)+'.jpg';img.onerror=()=>img.classList.add('bad');const fallback=document.createElement('div');fallback.className='fallback';fallback.textContent=names[idx];const caption=document.createElement('span');caption.textContent=names[idx];p.append(img,fallback,caption);wall.appendChild(p);const lamp=document.createElement('div');lamp.className='artlight';wall.appendChild(lamp);const sec=document.createElement('div');sec.className='sectionmark';sec.textContent='EXHIBITION  ·  0'+(idx+1);wall.appendChild(sec)}else if(j===0){const title=document.createElement('div');title.className='intro';title.style.fontSize='27px';title.style.lineHeight='1.8';title.style.color='#e7d4b3';title.innerHTML='我的影子<br>罷工了';wall.appendChild(title)}room.appendChild(wall)};let x=0,z=0,yaw=0,dy=0;const key={};const paint=()=>{room.style.transform='rotateY('+(-yaw)+'deg) translate3d('+(-x)+'px,0px,'+(-z)+'px)'};paint();document.querySelectorAll('[data-key]').forEach(btn=>{const k=btn.dataset.key;const down=e=>{e.preventDefault();key[k]=true;btn.setPointerCapture?.(e.pointerId)},up=e=>{key[k]=false};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('lostpointercapture',up)});document.addEventListener('keydown',e=>{const map={w:'f',ArrowUp:'f',s:'b',ArrowDown:'b',a:'l',ArrowLeft:'ql',d:'r',ArrowRight:'qr'};if(map[e.key]){key[map[e.key]]=true;e.preventDefault()}});document.addEventListener('keyup',e=>{const map={w:'f',ArrowUp:'f',s:'b',ArrowDown:'b',a:'l',ArrowLeft:'ql',d:'r',ArrowRight:'qr'};if(map[e.key])key[map[e.key]]=false});let touch=null;view.addEventListener('pointerdown',e=>touch={x:e.clientX,y:e.clientY});view.addEventListener('pointermove',e=>{if(!touch)return;const dif=e.clientX-touch.x;yaw+=dif*.20;touch={x:e.clientX,y:e.clientY};paint()});view.addEventListener('pointerup',()=>touch=null);view.addEventListener('pointercancel',()=>touch=null);let last=performance.now();function tick(t){let dt=Math.min((t-last)/16.7,3);last=t;let turn=(+!!key.qr-+!!key.ql)*1.6*dt;yaw+=turn;let ang=yaw*Math.PI/180;let vx=(+!!key.r-+!!key.l)*7*dt,vz=(+!!key.b-+!!key.f)*7*dt;x+=Math.cos(ang)*vx+Math.sin(ang)*vz;z+=-Math.sin(ang)*vx+Math.cos(ang)*vz;const rad=Math.hypot(x,z);if(rad>480){x=x*480/rad;z=z*480/rad;}paint();requestAnimationFrame(tick)}requestAnimationFrame(tick);document.querySelectorAll('.piece').forEach(p=>p.addEventListener('click',()=>{const i=Number(p.dataset.i);document.getElementById('mt').textContent=names[i];document.getElementById('mi').src=p.querySelector('img').src;document.getElementById('md').textContent=texts[i];document.getElementById('modal').classList.add('open')}));document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.classList.remove('open')})})();
</script></body></html>
