if(!window.THREE){document.getElementById('status').textContent='3D 引擎載入失敗，請確認網路連線';return}const scene=new THREE.Scene();scene.background=new THREE.Color(0x111a2c);scene.fog=new THREE.Fog(0x111a2c,12,40);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);camera.position.set(0,1.62,2.5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));document.getElementById('scene').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbad8ff,0x574331,1.7));const light=new THREE.PointLight(0xffdfad,1.3,30);light.position.set(0,4,0);scene.add(light);const R=8;const wallMat=new THREE.MeshStandardMaterial({color:0x3a4862,side:THREE.DoubleSide,roughness:.9});const floor=new THREE.Mesh(new THREE.CylinderGeometry(R,R,.2,64),new THREE.MeshStandardMaterial({color:0x263246,roughness:1}));floor.position.y=-.11;scene.add(floor);const ceil=new THREE.Mesh(new THREE.CylinderGeometry(R,R,.1,64),new THREE.MeshStandardMaterial({color:0x1b2437}));ceil.position.y=4.3;scene.add(ceil);for(let i=0;i<32;i++){const a=i*Math.PI*2/32,b=(i+1)*Math.PI*2/32;let points=[new THREE.Vector3(R*Math.sin(a),0,R*Math.cos(a)),new THREE.Vector3(R*Math.sin(b),0,R*Math.cos(b)),new THREE.Vector3(R*Math.sin(b),4.3,R*Math.cos(b)),new THREE.Vector3(R*Math.sin(a),4.3,R*Math.cos(a))];const geo=new THREE.BufferGeometry().setFromPoints([points[0],points[1],points[2],points[0],points[2],points[3]]);geo.computeVertexNormals();scene.add(new THREE.Mesh(geo,wallMat))}const art=[];function label(t){const c=document.createElement('canvas');c.width=640;c.height=420;const x=c.getContext('2d');x.fillStyle='#1d2940';x.fillRect(0,0,640,420);x.strokeStyle='#e6c697';x.lineWidth=7;x.strokeRect(18,18,604,384);x.fillStyle='#f3e5d2';x.textAlign='center';x.font='bold 34px sans-serif';x.fillText(t,320,205);x.font='20px sans-serif';x.fillText('點擊查看展品介紹',320,255);return new THREE.CanvasTexture(c)}function buildArt(i){const count=Math.max(works.length,6),a=(i+.5)*Math.PI*2/count;const mat=new THREE.MeshBasicMaterial({map:label(works[i][0]),side:THREE.DoubleSide});if(i<5){new THREE.TextureLoader().load(preview,tex=>{tex.encoding=THREE.sRGBEncoding;tex.wrapS=THREE.RepeatWrapping;tex.repeat.set(.2,1);tex.offset.set(i*.2,0);mat.map=tex;mat.needsUpdate=true},undefined,()=>{})}const mesh=new THREE.Mesh(new THREE.PlaneGeometry(3.1,2.1),mat);mesh.position.set(Math.sin(a)*(R-.17),2.25,Math.cos(a)*(R-.17));mesh.rotation.y=a+Math.PI;mesh.userData.index=i;scene.add(mesh);art.push(mesh)}works.forEach((_,i)=>buildArt(i));let yaw=0,pitch=0,drag=null,motion={up:false,down:false,left:false,right:false};const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;yaw-=dx*.005;pitch=Math.max(-1.1,Math.min(1.1,pitch-dy*.004));drag.x=e.clientX;drag.y=e.clientY});const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();canvas.addEventListener('pointerup',e=>{if(!drag)return;const dist=Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY);drag=null;if(dist>12)return;pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(art);if(hits.length)show(hits[0].object.userData.index)});for(const b of document.querySelectorAll('[data-m]')){const k=b.dataset.m;b.onpointerdown=e=>{motion[k]=true;b.setPointerCapture(e.pointerId);e.preventDefault()};b.onpointerup=b.onpointercancel=()=>motion[k]=false}onkeydown=e=>{const k=({w:'up',ArrowUp:'up',s:'down',ArrowDown:'down',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'})[e.key];if(k)motion[k]=true};onkeyup=e=>{const k=({w:'up',ArrowUp:'up',s:'down',ArrowDown:'down',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'})[e.key];if(k)motion[k]=false};let prev=performance.now();function frame(t){requestAnimationFrame(frame);const dt=Math.min((t-prev)/1000,.05);prev=t;camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;const f=(+motion.up- +motion.down)*dt*3.2,s=(+motion.right- +motion.left)*dt*3.2;const x=camera.position.x+Math.sin(yaw)*f+Math.cos(yaw)*s,z=camera.position.z-Math.cos(yaw)*f+Math.sin(yaw)*s;if(Math.hypot(x,z)<R-1){camera.position.x=x;camera.position.z=z}renderer.render(scene,camera)}requestAnimationFrame(frame);onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}})();
