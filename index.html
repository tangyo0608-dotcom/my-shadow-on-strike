<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>我的影子罷工了｜3D 互動展館</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0e1422;color:#fff;font-family:system-ui,"Noto Sans TC",sans-serif}#scene{position:fixed;inset:0;touch-action:none}.ui{position:fixed;z-index:2;background:rgba(12,20,36,.72);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(12px);border-radius:16px;padding:12px}.head{left:12px;top:12px;max-width:65%}.head b{font-size:17px}.head p{font-size:12px;margin:6px 0 0;color:#cfd8e4}.right{right:12px;top:12px;display:flex;gap:6px}.right button,.panel button{background:#f1cc9b;border:0;color:#1f2738;padding:10px;border-radius:9px;font-weight:600}.pad{left:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,49px);gap:5px}.pad button{height:49px;font-size:22px;background:#23324d;color:white;border:1px solid #7487a0;border-radius:10px;touch-action:none}#overlay{display:none;position:fixed;z-index:5;inset:0;align-items:center;justify-content:center;background:rgba(4,9,18,.72);padding:20px}#overlay.show{display:flex}.panel{background:rgba(20,30,47,.94);border:1px solid #8290a5;border-radius:18px;max-height:90vh;overflow:auto;width:min(540px,100%);padding:24px}.panel img,.panel video{max-width:100%;max-height:55vh;display:block;margin:auto;object-fit:contain}.panel p{line-height:1.8;color:#d5dce8}#media{margin-top:14px}.panel button{margin-top:12px}button{cursor:pointer}#status{position:fixed;right:12px;bottom:15px;z-index:2;font-size:12px;color:#e9e1d3}.notice{font-size:13px;padding:12px;border:1px dashed #8290a5;border-radius:9px;color:#d5dce8;margin-top:12px}@media(max-width:550px){.head{max-width:60%;}.right{top:75px}.head b{font-size:14px}}
</style></head><body><div id="scene"></div><div class="ui head"><b>我的影子罷工了</b><p>圓形 3D 互動展館 · 點選展牆上的作品</p></div><div class="ui right"><button id="upload">新增作品圖片</button><input id="file" type="file" accept="image/*,video/mp4" multiple hidden></div><div class="ui pad"><i></i><button data-m="up">▲</button><i></i><button data-m="left">◀</button><button data-m="down">▼</button><button data-m="right">▶</button></div><div id="status">拖曳轉動視角 · WASD / 方向鍵移動</div><div id="overlay"><div class="panel"><h2 id="title"></h2><div id="media"></div><p id="description"></p><button id="close">關閉</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script>
(()=>{const works=[["電影海報","《我的影子罷工了》三分鐘動畫短片主視覺，呈現少年與影子的同行。","assets/作品01.jpg"],["主角設定","主角陳以安，13 歲。角色三視圖、色彩設定與表情差分。","assets/作品02.jpg"],["服裝與角色細節","角色服裝、髮型、配件與表情變化設計。","assets/作品03.jpg"],["主角全身立繪","陳以安角色全身立繪與日常造型。","assets/作品04.jpg"],["動畫分鏡表","《我的影子罷工了》三幕式動畫分鏡：影子消失、影子逃走、重新成為自己。","assets/作品05.jpg"],["動畫短片","《我的影子罷工了》動畫影片。","assets/作品06.mp4"]]; const overlay=document.getElementById('overlay'),title=document.getElementById('title'),media=document.getElementById('media'),desc=document.getElementById('description');let selected=0;function show(i){selected=i;const w=works[i];title.textContent=w[0];desc.textContent=w[1];media.innerHTML='';const node=document.createElement(/\.mp4$/i.test(w[2])?'video':'img');node.src=w[2];if(node.tagName==='VIDEO'){node.controls=true;node.playsInline=true}node.onerror=()=>{media.innerHTML='<div class="notice">這件作品的媒體檔案尚未上傳；展覽資訊已可閱讀。</div>'};media.appendChild(node)overlay.classList.add('show')}document.getElementById('close').onclick=()=>{overlay.classList.remove('show');media.innerHTML=''};overlay.onclick=e=>{if(e.target===overlay)document.getElementById('close').click()};document.getElementById('upload').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>{for(const f of e.target.files){works.push([f.name,'觀眾本機預覽作品（不會自動同步到公開網站）',URL.createObjectURL(f)]);buildArt(works.length-1)}};
if(!window.THREE){document.getElementById('status').textContent='3D 引擎載入失敗，請確認網路連線';return}const scene=new THREE.Scene();scene.background=new THREE.Color(0x111a2c);scene.fog=new THREE.Fog(0x111a2c,12,40);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);camera.position.set(0,1.62,2.5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));document.getElementById('scene').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbad8ff,0x574331,1.7));const light=new THREE.PointLight(0xffdfad,1.3,30);light.position.set(0,4,0);scene.add(light);const R=8;const wallMat=new THREE.MeshStandardMaterial({color:0x3a4862,side:THREE.DoubleSide,roughness:.9});const floor=new THREE.Mesh(new THREE.CylinderGeometry(R,R,.2,64),new THREE.MeshStandardMaterial({color:0x263246,roughness:1}));floor.position.y=-.11;scene.add(floor);const ceil=new THREE.Mesh(new THREE.CylinderGeometry(R,R,.1,64),new THREE.MeshStandardMaterial({color:0x1b2437}));ceil.position.y=4.3;scene.add(ceil);for(let i=0;i<32;i++){const a=i*Math.PI*2/32,b=(i+1)*Math.PI*2/32;let points=[new THREE.Vector3(R*Math.sin(a),0,R*Math.cos(a)),new THREE.Vector3(R*Math.sin(b),0,R*Math.cos(b)),new THREE.Vector3(R*Math.sin(b),4.3,R*Math.cos(b)),new THREE.Vector3(R*Math.sin(a),4.3,R*Math.cos(a))];const geo=new THREE.BufferGeometry().setFromPoints([points[0],points[1],points[2],points[0],points[2],points[3]]);geo.computeVertexNormals();scene.add(new THREE.Mesh(geo,wallMat))}const art=[];function label(t){const c=document.createElement('canvas');c.width=640;c.height=420;const x=c.getContext('2d');x.fillStyle='#1d2940';x.fillRect(0,0,640,420);x.strokeStyle='#e6c697';x.lineWidth=7;x.strokeRect(18,18,604,384);x.fillStyle='#f3e5d2';x.textAlign='center';x.font='bold 34px sans-serif';x.fillText(t,320,205);x.font='20px sans-serif';x.fillText('點擊查看展品介紹',320,255);return new THREE.CanvasTexture(c)}function buildArt(i){const count=Math.max(works.length,6),a=(i+.5)*Math.PI*2/count;const mat=new THREE.MeshBasicMaterial({map:label(works[i][0]),side:THREE.DoubleSide});if(i<5){new THREE.TextureLoader().load(works[i][2],tex=>{tex.encoding=THREE.sRGBEncoding;mat.map=tex;mat.needsUpdate=true},undefined,()=>{})}const mesh=new THREE.Mesh(new THREE.PlaneGeometry(3.1,2.1),mat);mesh.position.set(Math.sin(a)*(R-.17),2.25,Math.cos(a)*(R-.17));mesh.rotation.y=a+Math.PI;mesh.userData.index=i;scene.add(mesh);art.push(mesh)}works.forEach((_,i)=>buildArt(i));let yaw=0,pitch=0,drag=null,motion={up:false,down:false,left:false,right:false};const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;yaw-=dx*.005;pitch=Math.max(-1.1,Math.min(1.1,pitch-dy*.004));drag.x=e.clientX;drag.y=e.clientY});const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();canvas.addEventListener('pointerup',e=>{if(!drag)return;const dist=Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY);drag=null;if(dist>12)return;pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(art);if(hits.length)show(hits[0].object.userData.index)});for(const b of document.querySelectorAll('[data-m]')){const k=b.dataset.m;b.onpointerdown=e=>{motion[k]=true;b.setPointerCapture(e.pointerId);e.preventDefault()};b.onpointerup=b.onpointercancel=()=>motion[k]=false}onkeydown=e=>{const k=({w:'up',ArrowUp:'up',s:'down',ArrowDown:'down',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'})[e.key];if(k)motion[k]=true};onkeyup=e=>{const k=({w:'up',ArrowUp:'up',s:'down',ArrowDown:'down',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'})[e.key];if(k)motion[k]=false};let prev=performance.now();function frame(t){requestAnimationFrame(frame);const dt=Math.min((t-prev)/1000,.05);prev=t;camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;const f=(+motion.up- +motion.down)*dt*3.2,s=(+motion.right- +motion.left)*dt*3.2;const x=camera.position.x+Math.sin(yaw)*f+Math.cos(yaw)*s,z=camera.position.z-Math.cos(yaw)*f+Math.sin(yaw)*s;if(Math.hypot(x,z)<R-1){camera.position.x=x;camera.position.z=z}renderer.render(scene,camera)}requestAnimationFrame(frame);onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}})();
</script></body></html>
